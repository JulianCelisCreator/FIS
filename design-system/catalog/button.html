<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Button · ps</title><link rel="stylesheet" href="../ps.css"></head>
<body><div class="ps-container ps-stack">
<a class="ps-link" href="./index.html">← Catálogo</a>
<h1>Button</h1><p class="ps-text-body-sm">RF: transversal. Contrato: variantes primary/secondary/ghost/destructive; tamaños sm/md/lg; estados por atributos.</p>
<div class="ps-cluster">
<button class="ps-button ps-button--primary">Guardar</button>
<button class="ps-button ps-button--secondary">Cancelar</button>
<button class="ps-button ps-button--ghost">Filtrar</button>
<button class="ps-button ps-button--destructive">Anular pago</button>
<button class="ps-button ps-button--primary ps-demo-hover">Hover</button>
<button class="ps-button ps-button--primary ps-demo-focus">Foco</button>
<button class="ps-button ps-button--primary" disabled>Disabled</button>
<button class="ps-button ps-button--destructive" aria-busy="true" aria-disabled="true"><span class="ps-button__spinner"></span>Anular pago</button>
</div>
<pre class="ps-text-caption">&lt;button class="ps-button ps-button--primary ps-button--md"&gt;Guardar&lt;/button&gt;</pre>
</div><script type="module" src="../ps.js"></script></body></html>
